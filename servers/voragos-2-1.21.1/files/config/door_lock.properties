disable_block_break_when_locked=false # Stop block break event if block is locked. [default: false]
disable_redstone_when_locked=true # Stop redstone inputs from interacting with a locked block. [default: true]
universal_unlocks_iron=false # Use universal key to unlock iron types. [default: false]
show_password_on_key=true # Show key password in item tooltip. [default: true]

