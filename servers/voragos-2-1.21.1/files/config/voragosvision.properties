# VoragosVision - configuracion del cliente (Axolstudio)
version_config=6
# Animacion de carga: llenar | girar | ambos
estilo_carga=ambos
# Donde aparece el logo de carga: abajo_derecha | abajo_centro | abajo_izquierda
posicion_carga=abajo_derecha
# Alto del logo de carga en pixeles de interfaz (6-80)
tamano_carga=10
# Color del relleno del logo y del brillo (hex RRGGBB)
color_relleno=FFFFFF
color_brillo=8FD8FF
# Nitidez del video (0.0 = apagado, 1.0 = maximo). Recomendado 0.6
nitidez=0.6
# Decodificacion de alta calidad (corrige los ajustes de baja calidad de WaterMedia)
decodificacion_hq=true
# Pausar musica/sonidos del juego mientras hay un video a pantalla completa
pausar_sonidos_juego=true
# Como se adapta el video a la pantalla:
#   estirar  = ocupa toda la pantalla (puede deformarse si la proporcion no coincide)
#   rellenar = ocupa toda la pantalla sin deformar (recorta las orillas que sobren)
#   ajustar  = se ve completo sin deformar (puede dejar barras negras)
ajuste_video=estirar
# Mostrar en una esquina la resolucion real del video (para revisar si el link es de baja calidad)
mostrar_resolucion=false
# Links de YouTube en HD (si falla, se usa el link normal)
youtube_hd=true
# Calidad maxima a pedir en YouTube / transmisiones (720, 1080, 1440, 2160)
calidad_maxima=1080
# FPS maximos para YouTube (30 consume la mitad que 60)
fps_maximo=60
